services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: personal_life_os
      POSTGRES_USER: personal_life_os
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U personal_life_os -d personal_life_os"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
